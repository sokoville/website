<!DOCTYPE html>
<html lang="en" style="height: 99%">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>online notepad</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="matthew.css">
    </head>
    <body id="notepad" style="height: 99%;">
        <textarea id="input" placeholder="Type something..." style="width: calc(100% - 10px); height: calc(100% - (3em)); resize: none;"></textarea>
        <button id="download" onclick="save_input()" style="position: fixed; bottom: 12px; left: 10px; z-index: 9999; font-family: Arimo;">Download</button>
    </body>
    <script>
        const input = document.getElementById("input"); 

        function save_input() {
            var a = document.createElement("a");
            var file = new Blob([input.value], {type: "text"});
            a.href = URL.createObjectURL(file);
            a.download = "notepad.txt";
            a.click();
        }

        input.addEventListener("keydown", function (event) {
            if (event.key === "Tab") {
                event.preventDefault();
                
                const start = this.selectionStart;

                this.value = this.value.substring(0, this.selectionStart) + "    " + this.value.substring(this.selectionEnd);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });
    </script>
</html>
