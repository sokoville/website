<!DOCTYPE html>
<html lang="en">
	<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>comics @ deadworldonline</title>
        <link rel="stylesheet" href="../styles.css">
        <link rel="stylesheet" href="../matthew.css">
	</head>
	<body>
        <div>
            <div style="width: 25%; display: inline-grid;">
                <img style="width: 100%" id="heathcliff" alt="Sorry, it's Sunday! I can't get you the Heathcliff today because it's just sooo long!">
            </div>
            <div style="margin-left: 2em; width: 70%; display: inline-grid;">
                <img style="width: 100%" id="peanuts">
            </div>
        </div>

        <script>
            function getDateStringForPeanuts() {
                const date = new Date
                const month = String(date.getMonth() + 1).padStart(2, "0");
                const day = String(date.getDay() + 1).padStart(2, "0");
                return `1966${month}${day}`;
            }
            fetch('https://heathcliff-api.winget.cloud/comic/original/newest?comicType=heathcliff')
            .then(res => res.json())
            .then(data => {
            document.getElementById('heathcliff').src = data.imageUrl;
            // or data.croppedImageUrl for a tighter crop without the border/date stamp
            })
            .catch(err => console.error('Failed to load comic:', err));
            document.getElementById('peanuts').src = "https://peanuts-search.com/I/" + getDateStringForPeanuts();
        </script>
    </body>
</html>
